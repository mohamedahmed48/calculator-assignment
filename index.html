
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">

    <header class="header">
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h2>Nova Calculator</h2>
          <p>Smart calculation experience</p>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" title="Change theme">☾</button>
    </header>

    <section class="display-section">
      <div class="display-label">CALCULATION</div>
      <div id="previous" class="previous"></div>
      <input type="text" id="display" value="0" readonly>
    </section>

    <section class="buttons">

      <button class="special" data-action="clear">AC</button>
      <button class="special" data-action="backspace">⌫</button>
      <button class="special" data-value="(">(</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="special" data-action="percent">%</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equal" data-action="calculate">=</button>

    </section>

    <section class="history-section">
      <div class="history-heading">
        <h3>Recent History</h3>
        <button id="clearHistory">Clear all</button>
      </div>
      <div id="history" class="history">
        <p class="empty">Your calculations will appear here.</p>
      </div>
    </section>

    <footer>
      <span>Nova Calculator</span>
      <span>Designed for everyone ✦</span>
    </footer>

  </main>

  <script src="main.js"></script>
</body>
</html>
